name: Redraw the sequencer

# Redraws the contribution sequencer once a day and whenever the drawing code
# changes. The pictures are published to the `output` branch, so the daily
# redraw never adds commits to the default branch.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main, profile]
    paths:
      - "art/**"
      - ".github/workflows/sequencer.yml"

permissions:
  contents: write

concurrency:
  group: sequencer
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --quiet "pillow>=11,<13"

      - name: Bring back the last good calendar
        run: |
          if git fetch --quiet --depth=1 origin output; then
            git show FETCH_HEAD:sequencer.json > assets/sequencer.json || rm -f assets/sequencer.json
          fi

      - name: Draw
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python art/sequencer.py

      - name: Publish to the output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out="$(mktemp -d)"
          cp assets/sequencer.gif assets/sequencer.png assets/sequencer-compact.gif assets/sequencer-compact.png "$out"/
          if [ -f assets/sequencer.json ]; then cp assets/sequencer.json "$out"/; fi
          cd "$out"
          git init --quiet --initial-branch=output
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Redraw the sequencer"
          git push --quiet --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
